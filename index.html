<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: #fff;
            font-family: 'Arial', sans-serif;
        }
        .calculator {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .display {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            font-size: 2em;
            text-align: right;
            margin-bottom: 10px;
        }
        button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.5em;
            margin: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .neon {
            color: #00ffcc;
            text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc;
        }
        .history {
            margin-top: 20px;
            font-size: 0.8em;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <button class="neon" onclick="clearDisplay()">C</button>
        <button class="neon" onclick="appendToDisplay('(')">(</button>
        <button class="neon" onclick="appendToDisplay(')')">)</button>
        <button class="neon" onclick="appendToDisplay('/')">&divide;</button>
        <button class="neon" onclick="appendToDisplay('7')">7</button>
        <button class="neon" onclick="appendToDisplay('8')">8</button>
        <button class="neon" onclick="appendToDisplay('9')">9</button>
        <button class="neon" onclick="appendToDisplay('*')">&times;</button>
        <button class="neon" onclick="appendToDisplay('4')">4</button>
        <button class="neon" onclick="appendToDisplay('5')">5</button>
        <button class="neon" onclick="appendToDisplay('6')">6</button>
        <button class="neon" onclick="appendToDisplay('-')">-</button>
        <button class="neon" onclick="appendToDisplay('1')">1</button>
        <button class="neon" onclick="appendToDisplay('2')">2</button>
        <button class="neon" onclick="appendToDisplay('3')">3</button>
        <button class="neon" onclick="appendToDisplay('+')">+</button>
        <button class="neon" onclick="appendToDisplay('0')">0</button>
        <button class="neon" onclick="appendToDisplay('%')">%</button>
        <button class="neon" onclick="calculateSquareRoot()">√</button>
        <button class="neon" onclick="calculateResult()">=</button>
        <div class="history" id="history"></div>
    </div>
    <script>
        let display = document.getElementById('display');
        let history = document.getElementById('history');

        function appendToDisplay(value) {
            if (display.innerText === '0') {
                display.innerText = '';
            }
            display.innerText += value;
        }

        function clearDisplay() {
            display.innerText = '0';
        }

        function calculateResult() {
            try {
                let result = eval(display.innerText);
                history.innerHTML += display.innerText + ' = ' + result + '<br>';
                display.innerText = result;
            } catch (error) {
                display.innerText = 'Error';
            }
        }

        function calculateSquareRoot() {
            try {
                let result = Math.sqrt(eval(display.innerText));
                history.innerHTML += '√' + display.innerText + ' = ' + result + '<br>';
                display.innerText = result;
            } catch (error) {
                display.innerText = 'Error';
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key >= '0' && event.key <= '9') {
                appendToDisplay(event.key);
            } else if (event.key === 'Enter') {
                calculateResult();
            } else if (event.key === 'Backspace') {
                clearDisplay();
            } else if (event.key === 'Escape') {
                clearDisplay();
            } else if (['+', '-', '*', '/'].includes(event.key)) {
                appendToDisplay(event.key);
            }
        });
    </script>
</body>
</html>
