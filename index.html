<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: #fff;
            font-family: 'Arial', sans-serif;
        }
        .calculator {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        .display {
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            text-align: right;
            padding: 10px;
            font-size: 2em;
            color: #00ffcc;
            border: none;
        }
        button {
            width: 60px;
            height: 60px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.5em;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: rgba(0, 255, 255, 0.5);
        }
        .history {
            max-height: 100px;
            overflow-y: auto;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display" disabled>
        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendToDisplay('(')">(</button>
            <button onclick="appendToDisplay(')')">)</button>
            <button onclick="appendToDisplay('/')">&divide;</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('*')">&times;</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('-')">-</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('+')">+</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('%')">%</button>
            <button onclick="calculate()">=</button>
            <button onclick="appendToDisplay('sqrt(')">√</button>
        </div>
        <div class="history" id="history"></div>
    </div>
    <script>
        let display = document.getElementById('display');
        let history = document.getElementById('history');

        function appendToDisplay(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                let result = eval(display.value.replace(/sqrt\(([^)]+)\)/g, 'Math.sqrt($1)'));
                history.innerHTML += '<div>' + display.value + ' = ' + result + '</div>';
                display.value = result;
            } catch (error) {
                display.value = 'Error';
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key >= '0' && event.key <= '9' || 
                event.key === '+' || event.key === '-' || 
                event.key === '*' || event.key === '/' || 
                event.key === '(' || event.key === ')' || 
                event.key === 'Enter' || event.key === 'Backspace' || 
                event.key === 'c' || event.key === 'C') {
                if (event.key === 'Enter') {
                    calculate();
                } else if (event.key === 'Backspace') {
                    display.value = display.value.slice(0, -1);
                } else if (event.key === 'c' || event.key === 'C') {
                    clearDisplay();
                } else {
                    appendToDisplay(event.key);
                }
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
