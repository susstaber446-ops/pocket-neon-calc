<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Neon Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #0f172a, #020617);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f8fafc;
            padding: 16px;
        }
        .calculator {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2), inset 0 0 15px rgba(56, 189, 248, 0.05);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
        .display-container {
            background: rgba(2, 6, 23, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            text-align: right;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        .equation {
            font-size: 14px;
            color: #64748b;
            min-height: 20px;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .display {
            font-size: 2.4em;
            font-weight: 700;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        button {
            background: rgba(30, 41, 59, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #f1f5f9;
            font-size: 1.25em;
            font-weight: 600;
            padding: 16px 0;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            user-select: none;
            backdrop-filter: blur(8px);
        }
        button:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(1px);
            background: rgba(56, 189, 248, 0.25);
        }
        button.op {
            color: #38bdf8;
            font-weight: 700;
        }
        button.clear {
            color: #f87171;
        }
        button.equals {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 16px rgba(2, 132, 199, 0.4);
        }
        button.equals:hover {
            background: linear-gradient(135deg, #0369a1, #0284c7);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }
        .history-card {
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px 16px;
            max-height: 120px;
            overflow-y: auto;
        }
        .history-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #94a3b8;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-item .res {
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="header">
            <span class="brand">Cyber Neon Calc</span>
            <div class="status-dot"></div>
        </div>
        <div class="display-container">
            <div class="equation" id="equation">Ready</div>
            <div class="display" id="display">0</div>
        </div>
        <div class="grid">
            <button class="clear" onclick="clearAll()">C</button>
            <button class="op" onclick="append('(')">(</button>
            <button class="op" onclick="append(')')">)</button>
            <button class="op" onclick="append('/')">÷</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="op" onclick="append('*')">×</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button class="op" onclick="append('-')">−</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button class="op" onclick="append('+')">+</button>

            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button class="op" onclick="calcSqrt()">√</button>
            <button class="equals" onclick="compute()">=</button>
        </div>
        <div class="history-card">
            <div class="history-title">Tape History</div>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        const displayEl = document.getElementById('display');
        const equationEl = document.getElementById('equation');
        const historyList = document.getElementById('history-list');
        let expr = '';

        function updateUI() {
            displayEl.innerText = expr || '0';
        }

        function append(val) {
            expr += val;
            updateUI();
        }

        function clearAll() {
            expr = '';
            equationEl.innerText = 'Ready';
            updateUI();
        }

        function calcSqrt() {
            try {
                if (!expr) return;
                const evaluated = Function('"use strict";return (' + expr + ')')();
                const res = Math.sqrt(evaluated);
                addHistory('√(' + expr + ')', res);
                equationEl.innerText = '√(' + expr + ')';
                expr = String(res);
                updateUI();
            } catch (e) {
                displayEl.innerText = 'Error';
            }
        }

        function compute() {
            try {
                if (!expr) return;
                const sanitized = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
                const result = Function('"use strict";return (' + sanitized + ')')();
                addHistory(expr, result);
                equationEl.innerText = expr + ' =';
                expr = String(result);
                updateUI();
            } catch (err) {
                displayEl.innerText = 'Error';
            }
        }

        function addHistory(eq, res) {
            const row = document.createElement('div');
            row.className = 'history-item';
            row.innerHTML = '<span>' + eq + '</span><span class="res">' + res + '</span>';
            historyList.prepend(row);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') append(e.key);
            else if (['+', '-', '*', '/', '(', ')', '.'].includes(e.key)) append(e.key);
            else if (e.key === 'Enter') compute();
            else if (e.key === 'Backspace') {
                expr = expr.slice(0, -1);
                updateUI();
            } else if (e.key === 'Escape') clearAll();
        });
    </script>
</body>
</html>
